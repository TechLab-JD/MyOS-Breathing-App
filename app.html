<div class="app-window" id="BreathingApp">
  <div class="app-header"><span class="app-title">🫁 Breathing</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="br">
      <div class="br-pick"><button id="br-box" class="on">Box 4-4-4-4</button><button id="br-478">4-7-8</button></div>
      <div class="br-stage"><div id="br-circle" class="br-circle"><span id="br-phase">Ready</span></div></div>
      <div class="br-count">Cycles: <b id="br-cyc">0</b></div>
      <button id="br-toggle">Start</button>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
